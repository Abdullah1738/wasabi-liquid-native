[package]
name = "wasabi-liquid-native-abi-v24-types"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Dependency-free Rust representations of the Wasabi Liquid native ABI v24"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]

[workspace]
members = [
    ".",
    "crates/address",
    "crates/ordinary-wallet-plan",
    "crates/ordinary-wallet-pset",
    "crates/ordinary-pset",
    "crates/output-opening",
    "crates/transaction-validation",
    "crates/wallet-facts",
    "crates/wallet-facts-wire",
]
exclude = ["tools/ordinary-wallet-plan-public-proof-verifier"]
default-members = [
    ".",
    "crates/address",
    "crates/ordinary-wallet-plan",
    "crates/ordinary-wallet-pset",
    "crates/ordinary-pset",
    "crates/output-opening",
    "crates/transaction-validation",
    "crates/wallet-facts",
    "crates/wallet-facts-wire",
]
resolver = "3"

[patch.crates-io]
digest = { git = "https://github.com/liquid-wasabi/traits.git", rev = "113c5ba12876e332335e49d1462a2c96c9928006" }
secp256k1-zkp-sys = { git = "https://github.com/Abdullah1738/rust-secp256k1-zkp.git", rev = "06ea6e06da81d2e3a51733c8d9b5f6c5fa248c2e" }
