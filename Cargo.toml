[package]
name = "wasabi-liquid-native-abi-v24-types"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Dependency-free Rust representations of the Wasabi Liquid native ABI v24"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]

[workspace]
members = [
    ".",
    "crates/address",
    "crates/output-opening",
    "crates/transaction-validation",
]
default-members = [
    ".",
    "crates/address",
    "crates/output-opening",
    "crates/transaction-validation",
]
resolver = "3"
