[package]
name = "wasabi-liquid-native-wallet-facts"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Validated owned-output observations for Wasabi Liquid"

[dependencies]
elements = { git = "https://github.com/liquid-wasabi/rust-elements.git", rev = "85b423a3cd69ea5409c0fbcfda1ccbced6a25d27", default-features = false }
miniscript = { version = "=12.3.7", default-features = false, features = ["no-std"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
wasabi-liquid-native-transaction-validation = { path = "../transaction-validation" }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
rand = "0.8"
static_assertions = "1.1"
