[package]
name = "wasabi-liquid-native-coinjoin-partial-balance"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Per-participant partial-balance proof binding for Wasabi Liquid CoinJoin"

[lib]
crate-type = ["rlib"]

[dependencies]
elements = { git = "https://github.com/Abdullah1738/rust-elements.git", rev = "5b8865f8061459f82dcb8a1cf476b7ba17b14193", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
wasabi-liquid-native-coinjoin-pset-state = { path = "../coinjoin-pset-state" }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
rand = "0.8"
