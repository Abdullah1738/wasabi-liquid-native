[package]
name = "wasabi-liquid-native-coinjoin-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Versioned C ABI for Wasabi Liquid CoinJoin native proof and blinding primitives"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
elements = { git = "https://github.com/Abdullah1738/rust-elements.git", rev = "5b8865f8061459f82dcb8a1cf476b7ba17b14193", default-features = false }
rand = { version = "0.8", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
wasabi-liquid-native-coinjoin-collab-blinding = { path = "../coinjoin-collab-blinding" }
wasabi-liquid-native-coinjoin-equality-integration = { path = "../coinjoin-equality-integration" }
wasabi-liquid-native-coinjoin-partial-balance = { path = "../coinjoin-partial-balance" }
wasabi-liquid-native-coinjoin-pset-state = { path = "../coinjoin-pset-state" }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
rand = "0.8"
wasabi-liquid-native-credential-commitment-equality = { path = "../credential-commitment-equality" }
